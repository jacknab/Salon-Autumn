kind = "web"
previewPath = "/"
title = "Salon AI Receptionist"
version = "1.0.0"
id = "artifacts/salon-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21636

[services.development]
run = "pnpm --filter @workspace/salon-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/salon-ai", "run", "build" ]
publicDir = "artifacts/salon-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21636"
BASE_PATH = "/"
