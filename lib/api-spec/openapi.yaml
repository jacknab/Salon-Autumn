openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: demo
    description: Demo signup operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /demo:
    post:
      operationId: registerDemo
      tags: [demo]
      summary: Register for a free demo
      description: Stores the caller's phone number and returns the demo number to dial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoSignupInput"
      responses:
        "201":
          description: Demo registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoSignupResult"
        "400":
          description: Invalid phone number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Phone number already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DemoSignupInput:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
          description: 10-digit US phone number (digits only)
          pattern: "^[0-9]{10}$"
    DemoSignupResult:
      type: object
      required:
        - demoNumber
        - message
      properties:
        demoNumber:
          type: string
          description: The phone number to dial for the 5-minute demo call
        message:
          type: string
          description: Instructions for the demo
    ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
